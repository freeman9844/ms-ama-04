{% if v.policy %}
<section class="card officer-chat" aria-labelledby="officer-chat-title">
<h3 id="officer-chat-title">{{ _("심사 도우미") }}</h3>
{% if chat_enabled %}
<p class="note">{{ _("현금흐름·마켓 판매 성과·정책 판정·에이전트 의견을 근거로 답합니다. 대화는 저장하지 않으며 새로 고치면 사라집니다. 최종 결정은 심사역이 합니다.") }}</p>
<div class="chat-log" data-chat-log role="log" aria-live="polite"></div>
{% if chat_topics %}<div class="chat-suggestions">{% for topic, q in chat_topics %}<button type="button" class="button secondary" data-chat-suggest data-chat-topic="{{ topic }}">{{ _(q) }}</button>{% endfor %}</div>{% endif %}
<form class="chat-form" data-officer-chat data-url="/applications/{{ d.application_id|path }}/chat" data-csrf="{{ csrf }}">
  <label for="chat-question">{{ _("질문") }}</label>
  <textarea id="chat-question" name="question" rows="2" maxlength="500" required></textarea>
  <button type="submit">{{ _("보내기") }}</button>
</form>
<script src="/static/officer_chat.js" defer></script>
{% else %}
<p class="note">{{ _("채팅을 쓸 수 없습니다.") }}</p>
{% endif %}
</section>
{% endif %}
