  - layout: content
    notes: |
      앞의 표에서 010번, 게이트웨이 결정은 비용으로 보면 가장 아픈 결정이었어요. 막대 세 개를 보시죠. 에이전트를 직접 부를 때 신청 한 건의 AI 비용은 약 5.9센트였는데, 게이트웨이를 거치니 9.4센트로 59% 올랐습니다. 왜 올랐을까요? 게이트웨이 경로는 chat completions 방식이라 라운드마다 앞의 맥락을 통째로 다시 보내거든요. 그럼 그 돈으로 무엇을 샀을까요? 에이전트별 TPM 한도, Prompt Shields, 그리고 에이전트와 모델별 토큰 지표예요. 한 에이전트가 폭주해도 다른 에이전트를 굶기지 않고, 비용이 어디서 나는지 바로 보이게 된 거죠. 세 번째 막대는 분석가 모델을 gpt-5.6-sol로 바꾼 뒤입니다. 고쳐 쓰는 일이 줄면서 분석가 호출이 신청당 8.4회에서 4.3회로 줄었고, 비용은 7.4센트로 일부 돌아왔어요. 다만 열 건만 본 결과라 경향으로 봐 주세요. 앞에서 본 단위 경제를 떠올리면, 센트 단위 차이로 통제를 사는 건 남는 장사라고 판단했습니다. 게이트웨이를 거치면 비용이 59% 늘었다는 건, 거버넌스에도 가격이 있다는 뜻이에요. 운영에서는 이 차이를 통제 비용으로 따로 보고하는 게 맞다고 봅니다. 이어서 데이터 주권과 설명 가능성의 경계, 그리고 보안 이야기로 넘어가겠습니다.
