  - layout: content
    notes: |
      이제 설계의 대가를 볼게요. 결정은 모두 열한 개의 ADR로 남겼고, 그중 구조를 바꾼 여섯 개를 골랐습니다. 이 표는 가운데보다 오른쪽 칸이 중요해요. 결정마다 무엇을 내줬고 언제 다시 볼지를 적었거든요. 001 오케스트레이션은 Durable Functions로 흐름을 고정하면서 에이전트 간 자유 협업을 포기했습니다. 002 모델 배포는 Global Standard에 가명화를 더했는데, 추론 위치가 보장되지 않아서 운영 전환 때 다시 봐야 해요. 003 정책 엔진은 버전이 붙은 YAML 순수 함수이고, 임계값이 합성 분포 기준이라는 한계가 있죠. 009는 원천은 지우고 파생값과 근거 ID는 남기는 쪽으로 갔는데, 보존 범위는 법무 확인이 필요합니다. 010 AI 게이트웨이는 통제를 얻는 대신 건당 AI 비용이 59% 올랐고 Developer 티어라 SLA가 없어요. 011 WAF 진입점은 월 약 370달러가 들고 인증서는 아직 자체 서명입니다. 왜 대가를 이렇게 드러낼까요? 운영 전환 때 무엇을 다시 열어야 하는지가 바로 이 칸에 있기 때문이에요. ADR마다 재검토 조건을 적어 둔 덕분에, 운영 전환 회의의 안건 목록이 이미 준비된 셈이에요. 무엇을 결정해야 하는지 처음부터 찾을 필요가 없죠. 그중 비용이 오른 게이트웨이 결정을 숫자로 더 보겠습니다.
