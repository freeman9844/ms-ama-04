  - layout: content
    notes: |
      그럼 파일럿은 어떻게 할까요? 네 단계로 나눴습니다. 0단계는 운영 전환 준비예요. 앞의 표에서 본 Entra, 실데이터 연동, 공인 인증서, 모델 처리 위치를 정합니다. 1단계는 섀도 모드예요. 경보와 의견은 내지만 실제 조치는 기존 절차대로 합니다. 이 기간에 경보가 얼마나 먼저, 얼마나 정확하게 울리는지 실데이터로 재요. 2단계는 제한 파일럿입니다. 일부 셀러군에만 심사와 단계 안내를 적용하고, 나머지는 대조군으로 남겨 둬요. 3단계에서 12개월 손실률과 건당 원가를 놓고 CBO와 CRO가 함께 확대 여부를 정합니다. 왜 대조군이 필요할까요? 손실률이 낮아져도, 비교 대상이 없으면 경기가 좋아서인지 경보 덕분인지 구분할 수 없거든요. 섀도 모드를 먼저 두는 이유도 같습니다. 고객에게 아무 영향 없이 에이전트의 판단과 사람의 판단을 나란히 비교할 수 있으니까요. 단계별 기간과 표본 크기는 일부러 비워 뒀어요. 대출기관의 월 신청량과 연체율을 받아야 정할 수 있는 값이라서요. 단계 사이마다 멈출 수 있는 문이 있어요. 섀도 모드에서 경보 정밀도가 기대에 못 미치면 제한 파일럿으로 넘어가지 않고, 앞에서 말씀드린 철회 조건을 다시 적용합니다. 기간과 표본 크기는 월 신청량과 연체율을 받아 함께 정하고요. 그럼 이 파일럿에서 무엇을 잴지 지표로 보겠습니다.
    grid: {valign: middle}
    topic: 파일럿 계획과 요청
    subtitle: 섀도 모드로 시작해 대조군과 비교합니다
    archetype: process
    blocks:
      - type: steps
        style: timeline
        h: 300
        items:
          - {when: "0단계", title: 운영 전환 준비, body: "Entra·실데이터 연동·공인 인증서·모델 처리 위치 결정"}
          - {when: "1단계", title: 섀도 모드, body: "경보·의견만 내고 조치는 기존 절차로. 경보 리드·정밀도 실측"}
          - {when: "2단계", title: 제한 파일럿, body: "일부 셀러군에 심사·단계 안내 적용, 대조군 유지"}
          - {when: "3단계", title: 확대 결정, body: "12개월 손실률·건당 원가로 CBO·CRO 공동 판단"}
      - type: callout
        style: outline
        text: "단계별 기간과 표본 크기는 대출기관의 월 신청량과 연체율을 받아 함께 정합니다."

  - layout: content
    notes: |
      앞의 파일럿에서 무엇을 잴지, 원문의 성공 지표 다섯 개로 정리했어요. 지표마다 데모에 이미 있는 계측과 파일럿에서 더할 것을 나눴습니다. 취급 건당 비용은 AI 토큰 비용과 고정비를 이미 ops report로 뽑고 있으니, 심사역 검토 시간을 재서 활동기준원가로 붙이면 돼요. 처리 시간은 접수부터 대기열까지의 p50과 p95가 있으니, 기관 API 지연과 자료 보완 왕복, 결정까지 전체를 더해야 합니다. 경보 선행 기간은 평가 하네스가 있으니 실제 연체 이력 백테스트와 섀도 운영을 더해요. 신용비용과 자산 성장은 지금 계측이 없습니다. 신용비용은 경보 군과 대조군의 12개월 손실률로, 자산 성장은 승인 건수와 금액, 기존 심사 대비 승인율로 재겠습니다. 이 표에서 보셨으면 하는 건, 빈칸이 어디인지 이미 안다는 점이에요. 측정 설계가 먼저 있으니 결과를 놓고 해석을 다툴 일이 줄어듭니다. 특히 심사역 시간은 파일럿 첫날부터 재야 해요. 앞에서 말씀드린 철회 조건이 바로 이 숫자에 걸려 있으니까요. 다섯 지표 중 세 개는 이미 반쯤 계측이 있고, 두 개는 새로 만들어야 해요. 파일럿 예산을 잡으실 때 이 두 개, 특히 대조군 운영에 드는 비용을 꼭 넣어 주세요. 그럼 이 계획을 시작하려면 무엇이 필요한지, 오늘 요청드릴 결정 세 가지를 말씀드리겠습니다.
