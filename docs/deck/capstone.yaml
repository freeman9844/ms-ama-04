          - [대출자산 성장, 없음, "승인 건수·금액, 기존 심사 대비 승인율"]

  - layout: content
    notes: |
      이제 오늘 이 자리에서 세 가지 결정을 부탁드립니다. 먼저 CBO께는 파일럿에 넣을 셀러군과 대조군을 정해 주시고, 심사역 검토 시간을 재는 일을 승인해 주십사 요청드려요. 이 시간이 60% 절감을 판가름하니까요. CRO께는 결정권을 LLM 밖에 두는 원칙과 정책 규칙의 버전 관리 체계를 승인해 주시고, 섀도 모드를 얼마나 운영할지 합의를 부탁드립니다. IT와 보안, 법무 쪽에는 Entra 복원과 모델 처리 위치, 그리고 삭제 뒤에 무엇을 얼마나 보존할지 확정을 요청드려요. 세 요청 모두 큰 예산이 드는 결정은 아닙니다. 하지만 어느 하나라도 빠지면 섀도 모드조차 시작할 수 없는 선행 조건이에요. 특히 법무의 처리 위치 판단은 앞에서 말씀드린 세 번째 철회 조건과 바로 이어집니다. 세 결정이 서로 다른 부서에 걸쳐 있어서, 한 자리에서 함께 정하는 게 가장 빠르다고 봤어요. 그래서 오늘 이 자리를 빌려 한꺼번에 요청드리는 겁니다. 이 세 가지가 정해지면 0단계 준비를 바로 시작할 수 있어요. 요청을 이렇게 역할별로 나눈 건, 각 결정의 책임자를 분명히 하기 위해서예요. 누가 무엇을 승인했는지가 분명해야 파일럿 결과가 나왔을 때도 다음 결정을 빠르게 내릴 수 있습니다. 세 결정이 각자 다른 위험을 덮어 주는 구조이기도 하고요. 마지막으로 오늘 내용을 세 문장으로 정리하겠습니다.
