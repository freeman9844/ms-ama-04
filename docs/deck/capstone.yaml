  - layout: content
    notes: |
      앞의 구성을 네트워크로 다시 그리면 경계가 더 분명해져요. 밖에서 들어올 수 있는 길은 운영자 IP에서 WAF로 가는 것 하나뿐입니다. App Gateway 서브넷 뒤에는 internal 모드의 Container Apps 환경이 있고, 여기에 콘솔과 정책 엔진, Mock API가 올라가 있어요. 오케스트레이터는 Functions 서브넷에, APIM은 별도 서브넷에 내부 모드로 있습니다. 그리고 Foundry와 AI Search, Cosmos DB, Blob과 Queue, Key Vault, Service Bus는 모두 Private Endpoint 서브넷으로만 닿아요. 공용 엔드포인트는 꺼 두었습니다. 구성요소 사이 인증은 키 대신 관리 ID와 RBAC로 했고요. 이렇게 하면 무엇이 좋을까요? 키가 새어도 쓸 곳이 없고, 공격 표면이 문 하나로 줄어듭니다. 개발자 노트북에서 데이터베이스로 바로 붙는 일도 원천적으로 막히죠. 대신 배포할 때마다 운영자가 잠깐 문을 열었다 닫아야 해서 손이 더 가요. 이미지를 올리거나 함수를 배포할 때마다 그 창을 열어야 하거든요. 그 수고를 명령 몇 개로 줄인 이야기는 운영 파트에서 다시 할게요. 그럼 이 네트워크 위에서 신청 하나가 어떤 여정을 걷는지 보겠습니다.
