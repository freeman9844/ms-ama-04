          - {title: 이의 경로, body: "이의 회신은 차주 글 대신 판단 기록만 근거로 씁니다"}

  - layout: content
    notes: |
      그럼 공정성은 어떻게 쟀을까요? 지역별 추천 승인율로 쟀어요. 막대를 보시면 경기는 12.5%, 부산은 50%, 서울은 25%입니다. 가장 높은 곳과 낮은 곳의 차이가 37.5포인트예요. 저희가 정한 임계값이 20포인트였으니 경보가 올라갔죠. 업종 격차는 12.5포인트로 임계값 안이었어요. 업력 격차는 50포인트로 더 컸는데, 이건 업력 규칙 R104 하나로 설명이 됩니다. 업력이 짧으면 거절하는 규칙이 원래 있으니까요. 그럼 지역 격차는 차별일까요? 정직하게 말씀드리면 아직 알 수 없습니다. 지역마다 여덟 건씩밖에 없어서, 한 건만 달라도 비율이 12.5포인트씩 움직이거든요. 그래서 이 경보를 숨기지 않고 보고서에 그대로 두었고, 파일럿에서 실제 표본으로 다시 재기로 했어요. 여기서 중요한 건 공정성 검사가 실제로 경보를 울렸다는 사실입니다. 지표가 장식이 아니라 실제로 작동한다는 뜻이니까요. 숫자가 예쁘게 나왔다면 오히려 검사를 의심해야 했을 거예요. 운영에서도 이런 경보가 뜨면 규칙과 표본을 함께 들여다보는 게 맞겠죠. 그리고 이 측정은 한 번으로 끝나지 않아요. ops report를 돌릴 때마다 같은 계산이 다시 돌아서, 규칙을 바꾸면 격차가 어떻게 변하는지 바로 보입니다. 이제 대출이 나간 뒤의 이야기, 사후 관리로 넘어가겠습니다.
