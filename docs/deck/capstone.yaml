  # ── 마무리 ────────────────────────────────────────────
  - layout: content
    notes: |
      오늘 말씀드린 걸 세 가지로 줄이면 이렇습니다. 첫째, 판단은 모델이 돕되 결정은 정책 엔진과 심사역이 합니다. 에이전트가 아무리 좋아져도 이 선은 옮기지 않아요. 둘째, 숫자는 단위 경제와 함께 봐야 합니다. AI 비용은 이미 충분히 작으니 승부는 사람 시간에서 갈려요. 그래서 파일럿의 첫 측정 항목도 심사역 시간입니다. 셋째, 모르는 것을 먼저 말합니다. 합성 데이터와 작은 표본, 데모 인증이라는 한계를 숨기지 않고, 그걸 재는 섀도 모드 파일럿으로 가겠습니다. 이 세 문장이 오늘 권고의 전부예요. 세 가지 중 하나만 기억하신다면, 결정권을 모델 밖에 둔다는 첫 번째를 기억해 주세요. 나머지 두 가지는 그 원칙을 지키면서 사업이 되게 만드는 방법이니까요. 이 원칙이 서 있기 때문에 모델을 바꾸거나 에이전트를 늘려도 통제 구조는 그대로 유지됩니다. CRO 입장에서는 이게 가장 중요한 약속이고, CBO 입장에서는 빠르게 확장할 수 있는 바탕이 되죠. 오늘 보여드린 데모와 숫자, 한계는 모두 이 한 문장을 뒷받침하기 위한 것이었습니다. 다시 말해 오늘은 기술을 자랑하는 자리가 아니라, 사업을 시작해도 되는지 판단하는 자리였습니다. 그 판단을 돕기 위해 아는 것과 모르는 것을 나란히 놓았어요. 이 세 가지만 기억해 주셔도 오늘 발표의 목적은 충분히 이룬 셈이에요. 이제 마무리하겠습니다.
