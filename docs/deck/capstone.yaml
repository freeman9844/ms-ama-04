    subtitle: Azure 구성 · 9개 에이전트와 자율성 · 핵심 트레이드오프

  - layout: content
    notes: |
      방금 데모 뒤의 전체 그림을 한 장으로 보면 이렇습니다. 원칙은 하나예요. 흐름은 결정론 오케스트레이터가 쥐고, 판단은 각 단계 안에서 에이전트가 합니다. 모든 구성은 Korea Central 리전의 VNet 안에 있어요. 고객과 심사역이 들어오는 문은 App Gateway의 WAF v2 하나뿐입니다. 그 뒤에 심사역 콘솔이 있고, 신청이 들어오면 큐를 거쳐 Durable Functions 오케스트레이터가 단계를 하나씩 진행합니다. 오케스트레이터는 판정이 필요하면 정책 엔진을 부르고, 해석이 필요하면 APIM AI 게이트웨이를 통해 Foundry 에이전트를 부르죠. 마이데이터와 홈택스, PG 같은 외부 데이터는 데모에서는 Mock API로 대신했고, 동의 토큰이 있어야만 열려요. 이 구조의 장점은 무엇일까요? 에이전트가 엉뚱하게 굴어도 흐름 자체는 코드가 정한 순서를 벗어나지 않는다는 점입니다. 재시도와 보상, 사람을 기다리는 일도 코드가 관리해요. 대신 에이전트끼리 알아서 협업하며 새 경로를 찾는 유연함은 포기했습니다. 대출 같은 규제 업무에서는 예측 가능성이 유연함보다 중요하다고 봤어요. 감사할 때 같은 신청을 같은 순서로 다시 돌릴 수 있어야 하니까요. 이번엔 같은 구성을 네트워크 관점에서 보겠습니다.
