  # ── 04 증명 범위와 다음 단계 ──────────────────────────
  - layout: section
    notes: |
      마지막 파트입니다. 지금까지 보여드린 숫자가 어디까지 증명하고 어디서 멈추는지 먼저 정리할게요. 그리고 운영 전환 전에 닫아야 할 위험, 섀도 모드로 시작하는 파일럿 계획, 오늘 요청드릴 결정으로 마무리하겠습니다. 증명한 것과 못한 것부터 볼까요?
    section_no: "04"
    title: 증명 범위와 다음 단계
    subtitle: 보인 것과 못 보인 것 · 파일럿 계획 · 요청

  - layout: content
    notes: |
      지금까지 숫자를 많이 보여드렸는데, 그 숫자마다 짝이 있어요. 왼쪽은 데모가 보인 것이고, 오른쪽은 아직 보이지 못한 것입니다. 자동화 구간 p95가 1.2분이라 같은 날 결정이 가능하다는 건 보였지만, 심사역 검토와 자료 보완까지 포함한 48시간 전체는 못 쟀어요. 건당 기술 비용이 약 88센트라는 건 보였지만, 인건비와 운영비까지 포함한 60% 절감은 아직입니다. 합성 경로에서 경보가 약 70일 먼저 울린 건 보였지만, 실제 부도 이력 백테스트와 신용비용 효과는 못 봤고요. 결정권 분리와 근거 ID, 삭제 증명은 보였지만, 실제 Entra 신원으로 남는 감사 추적은 아직이에요. 왜 이렇게 나란히 놓을까요? 오른쪽 칸이 바로 다음 투자의 대상이기 때문입니다. 무엇을 모르는지 정확히 알아야 그걸 재는 데 돈을 쓸 수 있으니까요. 그래서 제안은 전면 도입이 아니라, 오른쪽 칸을 실데이터로 재는 섀도 모드 파일럿이에요. 왼쪽 칸은 그 파일럿을 시작해도 된다는 근거가 되고요. 이 장은 발표 전체에서 가장 중요한 장일 수도 있어요. 데모가 잘 돌았다는 것과 사업 목표를 달성했다는 것은 전혀 다른 이야기거든요. 그 차이를 저희 입으로 먼저 말씀드려야, 오늘 보여드린 숫자들도 믿으실 수 있다고 봤습니다. 그 전에 닫아야 할 위험을 표로 보겠습니다.
