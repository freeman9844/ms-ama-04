  - layout: content
    notes: |
      문제가 분명해졌으니 이제 선택지를 볼 차례예요. 대안은 네 가지를 놓았습니다. 지금처럼 사람이 하는 방식, 규칙 스코어카드로 자동화하는 방식, 외부 신용평가나 대출 SaaS를 들여오는 방식, 그리고 에이전트와 결정론 정책을 묶는 방식이죠. 기준은 일곱 줄이에요. 48시간 처리는 수작업만 못 맞춥니다. 정산 기록이나 거래 적요처럼 형식이 제각각인 데이터를 읽는 건 규칙이 약하고, SaaS는 부분적이에요. 대출 이후의 조기경보와 상환 지원까지 한 흐름으로 가는 건 마지막 대안뿐이고요. 반면 도입 위험은 앞의 두 개가 낮고, 뒤의 두 개는 중간입니다. 여기서 솔직히 말씀드릴 게 있어요. 이 표는 정성 판단입니다. 규칙 스코어카드는 정말 빠르고 싸지만, 정산이 늦어졌는지 선정산을 받았는지 같은 맥락을 못 읽어요. SaaS는 편하지만 데이터를 어디서 처리하고 동의가 끝나면 언제 지우는지 우리가 직접 통제하기 어렵죠. 그래서 맥락 해석과 통제를 함께 가져갈 수 있는 쪽을 골랐습니다. 대신 도입 위험이 중간이라는 점은 뒤에서 철회 조건으로 관리할 거예요. 표에서 예와 아니오만 보지 마시고 부분이라고 적힌 칸을 눈여겨봐 주세요. 실제 도입에서 문제가 되는 건 대부분 이 부분적인 지점들이거든요. 특히 SaaS의 데이터 통제 칸이 그렇습니다. 그럼 그 권고안의 구조를 보시죠.
    grid: {valign: middle}
    topic: 대안과 권고
