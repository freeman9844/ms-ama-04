  - layout: content
    notes: |
      방금 본 경보가 높음으로 나오면 고객에게 단계별로 안내가 나갑니다. 첫 번째 높음 경보가 나오면 잔고 부족 예상 알림을 보내고, 그 뒤로는 상환일 안내를 기본 3일 전이 아니라 5일 전에 보내요. 높음이 연속 두 번 나오면 2단계로 넘어갑니다. 상환일을 정산일 뒤로 옮기거나 분할납부하는 방법을 안내하고, 셀프 상환 플랜 링크를 함께 보내요. 고객이 이동이나 분할을 고르면 변경 요청이 생기고, 심사역이 승인해야 일정이 실제로 바뀝니다. 원문은 이 에이전트에게 L4, 즉 자율적인 경보 생성과 발송을 줬어요. 그럼 L4면 무엇이든 해도 될까요? 아래 두 카드가 그 선입니다. L4가 하는 건 승인된 템플릿 안내를 정책 코드가 자동으로 보내는 것뿐이고, 여기엔 LLM이 끼지 않아요. 대출 회수나 한도 축소, 부도 확정, 금리 변경은 하지 않고, 경보 문장에 그런 표현을 쓰는 것도 막았습니다. 고객을 돕는 안내와 불이익 조치를 분명히 나눈 거죠. 안내는 빨리 갈수록 좋고, 불이익은 사람이 신중하게 정해야 하니까요. 그래도 미납이 나면 어떻게 될까요? 이 단계 안내는 고객 입장에서 보면 독촉이 아니라 도움이에요. 상환일 직전에 갑자기 연체가 되는 것보다, 미리 알고 일정을 조정하는 쪽이 고객과 은행 모두에게 낫습니다. 그래서 안내는 자동으로 빠르게 보내도록 했어요. 추심 에이전트를 보겠습니다.
    grid: {valign: middle}
    topic: 사후 관리
    subtitle: 높음 경보는 단계별로 안내하되, 회수·한도 축소는 하지 않습니다
    archetype: process
    blocks:
      - type: steps
        style: arrows
        items:
          - {title: "1단계 · 첫 높음 경보", body: "잔고 부족 예상 알림 + 이후 상환일 5일 전 추가 안내(기본 3일 전)", icon: "fluent:alert"}
          - {title: "2단계 · 연속 두 번 높음", body: "상환일을 정산일 뒤로 이동·분할납부 안내 + 셀프 상환 플랜 링크", icon: "fluent:calendar"}
          - {title: "고객 선택 → 심사역 승인", body: "이동·분할을 고르면 변경 요청이 생기고, 승인되면 일정이 바뀝니다", icon: "fluent:checkmark_circle"}
      - type: cards
        body_size: 16
        style: outline
        columns: 2
        items:
          - {title: "L4가 하는 것", body: "승인된 템플릿 안내를 LLM 없이 정책 코드가 자동 발송합니다"}
          - {title: "L4가 하지 않는 것", body: "대출 회수·한도 축소·부도 확정·금리 변경 — 경보 문장에서도 금지"}

  - layout: content
    notes: |
      그래도 미납이 생기면 추심 에이전트가 움직이는데, 이 에이전트는 제안까지만 해요. 고객에게 보내는 건 심사역이 승인한 뒤입니다. 승인 화면에는 네 가지가 보여요. 첫째는 어떤 승인 스크립트를 쓸지, 상담을 권할지, 그리고 에이전트가 그렇게 판단한 이유입니다. 둘째는 몇 회차에 얼마가 밀렸고 누적은 얼마인지, 최근 경보와 확인할 조치, 지난 7일 연락 수 같은 근거예요. 셋째는 정책 확인 결과로, 스크립트와 연락 시간, 주간 한도, 금지 표현, PII 토큰을 다 통과했는지 보여 줍니다. 넷째는 회차 값까지 채운, 고객이 실제로 받게 될 문장 그대로예요. 심사역은 이걸 보고 그대로 승인하거나, 문구를 고쳐서 보내거나, 사유를 적고 반려할 수 있습니다. 반려에는 사유가 꼭 필요하고, 그때는 아무것도 나가지 않아요. 여기서 중요한 장치가 하나 더 있습니다. 결정을 누르는 순간 콘솔과 오케스트레이터가 같은 검사를 한 번 더 돌리고, 하나라도 걸리면 보내지 않아요. 화면을 띄워 둔 사이에 연락 가능 시간이 지나거나 다른 연락이 나갈 수 있거든요. 이 화면을 만들면서 기준으로 삼은 질문은 하나였어요. 심사역이 다른 창을 열지 않고 이 화면만 보고 결정할 수 있느냐는 거죠. 네 칸이 그 답입니다. 이어서 공정 추심 규칙과 평가 지표를 차례로 보겠습니다.
    grid: {valign: middle}
    topic: 사후 관리
    subtitle: "미납이면 추심 에이전트는 제안만, 발송은 심사역 승인 뒤"
    archetype: decision
    blocks:
      - type: cards
        body_size: 17
        h: 250
        style: header
        columns: 4
        items:
          - {title: "① 제안과 이유", icon: "fluent:bot", body: "승인 스크립트, 상담 권고 여부, 에이전트가 쓴 이유"}
          - {title: "② 판단 근거", icon: "fluent:data_trending", body: "회차·금액·누적 미납, 최근 경보와 확인할 조치, 7일 연락 수"}
          - {title: "③ 정책 확인", icon: "fluent:shield_checkmark", body: "승인 스크립트·연락 시간·주간 한도·금지 표현·PII 토큰"}
          - {title: "④ 고객 문구", icon: "fluent:chat", body: "회차 값을 채운 실제 발송 문장 그대로"}
      - type: steps
        style: chevron
        items:
          - {title: "승인 — 문구 그대로 발송"}
          - {title: "수정 — 고친 문구로 발송"}
          - {title: "반려 — 사유 필수, 발송 없음"}
      - type: callout
        style: outline
        icon: "fluent:shield_checkmark"
        text: "결정 직전에 콘솔과 오케스트레이터가 같은 정책 검사를 다시 돌립니다. 하나라도 걸리면 발송하지 않습니다."

  - layout: content
    notes: |
      방금 말씀드린 재검사가 무엇을 보는지, 조금 더 깊게 들어가 볼게요. 공정 추심 규칙은 숫자 네 개로 정리됩니다. 7일 동안 연락은 일곱 번까지이고, 넘으면 발송을 보류해요. 연락 시간은 한국 시간 오전 8시부터 밤 9시까지이고, 그 밖이면 역시 보류입니다. 문구는 300자를 넘을 수 없고 빈 문구도 막아요. 그리고 기본은 문구 발송만입니다. 재조정 상담 요청은 심사역이 체크할 때만 따로 생겨요. 처음엔 상담 요청이 자동으로 함께 생겼는데, 원하지 않는 업무가 늘어서 선택으로 바꿨습니다. 법적 조치나 압류, 소송 같은 금지 표현, 또는 가명 토큰이 문구에 남아 있으면 결정 자체가 반영되지 않고, 한 번 보류된 발송은 다시 보내지 않아요. 같은 규칙을 콘솔과 오케스트레이터가 같은 코드로 검사하니, 한쪽만 고쳐서 생기는 틈이 없습니다. 심사역이 문구를 고칠 때도 이 검사를 그대로 거쳐요. 사람이 고친 문구라고 해서 규칙을 건너뛰지 않는 거죠. 이 규칙들이 있는 이유는 단순해요. 연체 고객은 이미 어려운 상황이라, 연락의 횟수와 시간, 말투 하나하나가 민원과 평판으로 이어지기 쉽거든요. 그래서 사람의 판단과 별도로 코드가 마지막 선을 지키게 했습니다. 심사역이 바쁜 날에도 같은 기준이 적용되는 거죠. 이제 원래 흐름으로 돌아가 평가와 운영을 보겠습니다.
    grid: {valign: middle}
    topic: 사후 관리
    subtitle: 공정 추심 규칙은 콘솔과 오케스트레이터가 같은 코드로 다시 검사합니다
    archetype: numbers
    optional: true
    blocks:
      - type: stats
        style: card
        items:
          - {value: "7회", label: 7일 연락 한도, sub: "넘으면 발송 보류"}
          - {value: "08~21시", label: "연락 시간(KST)", sub: "밖이면 보류"}
          - {value: "300자", label: 문구 상한, sub: "빈 문구·초과 차단"}
          - {value: "기본 문구만", label: 재조정 상담 요청, sub: "심사역이 체크할 때만 생성"}
      - type: callout
        style: bar
        text: "금지 표현(법적 조치·압류·소송·회수·한도 축소·부도·금리 인상)과 가명 토큰이 있으면 결정을 반영하지 않습니다. 보류된 발송은 다시 보내지 않습니다."

  - layout: content
    notes: |
      여기서 평가 이야기로 넘어갈게요. 지금까지 말씀드린 품질 주장은 모두 평가 하네스에서 나왔어요. 이 장의 메시지는 품질과 비용을 같은 표에서 본다는 겁니다. 위에서부터 볼게요. 조기경보 precision은 에이전트가 판단했을 때 100%, 탐지기 혼자일 때 50%였어요. 탐지기는 신호만 보고 울리니 오경보가 절반이었고, 에이전트가 맥락을 보고 걸러낸 거죠. 심사 첫 라운드 근거 통과율은 gpt-5.6-sol이 100%, gpt-5.4가 75%였습니다. 거래 분류는 80%를 규칙만으로 처리하고 나머지만 모델로 보내요. 비싼 모델 호출을 줄이는 첫 번째 장치가 바로 이 규칙 층입니다. 그럼 이 숫자를 얼마나 믿어야 할까요? 아래 주의 문구가 답이에요. 합성 케이스에 한 번 돌린 결과라, LLM의 변동 범위 안일 수도 있습니다. 또 소형 모델을 gpt-5.6-luna로 바꾼 뒤의 품질은 아직 다시 재지 않았어요. 그래서 운영 전에 같은 하네스를 여러 번 돌려 분포를 보는 게 다음 일입니다. 하네스가 VNet 안에서 예산 상한을 두고 돌기 때문에 반복 비용도 크지 않아요. 결국 평가 하네스는 모델을 바꿀 때마다 돌리는 회귀 테스트 역할을 해요. 바꿀지 말지를 감이 아니라 숫자로 정하게 해 주는 거죠. 앞에서 본 모델 교체도 이런 비교를 거쳐 정했습니다. 이번엔 속도, 즉 SLO를 보겠습니다.
    grid: {valign: middle}
    topic: 평가와 운영
    subtitle: "평가 하네스 — 품질과 비용을 같은 표에서 봅니다"
    archetype: evaluation
    blocks:
      - type: progress
        style: bar
        value_format: "{v:g}%"
        items:
          - {label: "조기경보 precision — 에이전트", value: 100, highlight: true}
          - {label: "조기경보 precision — 탐지기 단독", value: 50}
          - {label: "심사 1라운드 근거 통과 — gpt-5.6-sol", value: 100, highlight: true}
          - {label: "심사 1라운드 근거 통과 — gpt-5.4", value: 75}
          - {label: "거래 분류 — 규칙만으로 처리", value: 80}
      - type: callout
        style: outline
        text: "합성 케이스·단일 실행 기준이라 LLM 변동 범위 안일 수 있습니다. 소형 모델을 gpt-5.6-luna로 바꾼 뒤 품질은 아직 재측정하지 않았습니다."

  - layout: content
    notes: |
      품질 다음은 속도예요. 네 숫자로 보시면 됩니다. 접수부터 심사역 대기까지 p95가 1.2분이에요. 목표 10분 안이고, 표본은 스물네 건입니다. 게이트웨이를 거치는 경로도 p95 1.8분이었고, 단계 144개가 모두 성공했어요. 에이전트 단계 성공률은 72번 중 72번으로 목표 99%를 넘었습니다. 조기경보는 합성 경로에서 평균 70.5일 먼저 울렸고요. 48시간 예산으로 보면 자동화 구간은 0.1%도 쓰지 않는 셈이에요. 그럼 48시간 목표를 달성했다고 말해도 될까요? 아닙니다. 이건 용량 시험이 아니고 표본도 작아요. 무엇보다 심사역이 검토하는 시간, 고객이 자료를 보완하는 왕복, 실제 기관 API의 지연이 빠져 있습니다. 48시간을 실제로 좌우하는 건 바로 이쪽이에요. 그래서 데모가 증명한 건 기계가 병목이 아니라는 것까지입니다. 거꾸로 보면 남은 시간 예산을 거의 전부 사람과 외부 연동에 쓸 수 있다는 뜻이기도 하고요. 남은 부분은 파일럿에서 재겠습니다. SLO를 이렇게 나눈 이유도 말씀드릴게요. 접수부터 대기열까지는 우리가 통제할 수 있는 구간이라 목표를 분 단위로 잡았고, 사람과 외부 기관이 끼는 구간은 파일럿에서 따로 재서 목표를 정할 계획이에요. 이어서 비용과 운영 방식을 짚고 마지막 파트로 넘어가겠습니다.
    grid: {valign: middle}
    topic: 평가와 운영
    subtitle: "SLO — 자동화 구간은 48시간 예산의 0.1% 미만입니다"
    archetype: numbers
    blocks:
      - type: stats
        style: card
        h: 220
        value_size: 52
        items:
          - {value: "1.2분", label: "접수 → 심사역 대기 p95", sub: "목표 ≤ 10분 · n=24"}
          - {value: "1.8분", label: 게이트웨이 경로 p95, sub: "단계 성공 144/144"}
          - {value: "100%", label: 에이전트 단계 성공률, sub: "목표 ≥ 99% · 72/72"}
          - {value: "70.5일", label: 조기경보 평균 리드, sub: "합성 경로 · 목표 60~90일"}
      - type: callout
        style: bar
        text: "용량 시험이 아니고 표본이 작습니다. 심사역 검토·자료 보완·기관 API 지연이 빠져 있어 48시간 목표 달성을 뜻하지는 않습니다."

  - layout: content
    notes: |
      앞에서 본 88센트에는 전제가 하나 있었어요. 조금 더 깊게 들어가 보면, 건당 기술 비용은 물량에 따라 크게 달라집니다. 월 100건이면 한 건에 8달러, 1,000건이면 88센트, 1만 건이면 17센트예요. 왜 이렇게 차이가 날까요? 대부분이 고정비이기 때문입니다. 건당 AI 비용은 게이트웨이 경로에서 잰 9.4센트를 보수적으로 썼고, 고정비는 월 약 788달러로 잡았어요. 실제 청구에서 잰 304달러에 APIM, Functions, WAF 추정치를 더한 값입니다. 그러니 파일럿 초기처럼 물량이 적을 때는 고정비를 줄이는 게 효과가 커요. 쓰지 않을 때는 ops pause로 Service Bus Premium을 내리고, 게이트웨이를 끌 수도 있습니다. 반대로 물량이 늘면 건당 비용은 알아서 내려가니, 규모가 커질수록 이 구조가 유리해지죠. 그래도 가장 비쌀 때인 8달러조차 목표 원가 1,400달러에 비하면 작은 숫자라는 점은 기억해 주세요. 결국 비용 판단의 무게는 여기서도 사람 시간에 있습니다. 파일럿 예산을 잡으실 때는 이 차트의 왼쪽 막대, 즉 물량이 적을 때를 기준으로 보시는 게 안전합니다. 확대 단계로 갈수록 오른쪽으로 옮겨 가니까요. 이제 원래 흐름으로 돌아가 마지막 파트로 넘어가겠습니다.
