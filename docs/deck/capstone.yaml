  - layout: content
    notes: |
      앞의 비교에서 고른 권고안을 한 문장으로 줄이면 이렇습니다. 모델은 설명하고 제안까지만 하고, 결정은 정책 엔진과 심사역이 해요. 위의 세 단계를 따라가 볼게요. 먼저 에이전트가 동의받은 범위 안에서만 데이터를 모으고, 거래를 분류하고, 근거가 붙은 의견과 경보를 씁니다. 다음으로 정책 엔진이 버전이 붙은 YAML 규칙으로 판정하고 reason code를 남겨요. 규칙이 실패하면 승인 쪽이 아니라 닫히는 쪽으로 떨어지고요. 마지막에 심사역이 승인이나 거절을 하고, 추심 문구도 심사역이 승인하거나 고치거나 반려합니다. 이 구조가 두 경영진에게 각각 무엇을 줄까요? CBO에게는 자동화 구간이 몇 분이라 같은 날 결정이 가능하다는 점이고, CRO에게는 결정권이 모델 밖에 있고 모든 판단에 근거 ID가 남는다는 점이에요. 대가도 있습니다. 에이전트끼리 자유롭게 협업하는 그림은 포기했고, 규칙을 계속 관리하는 비용이 들어요. 도입도 한 번에 하지 않고 섀도 모드, 제한 파일럿, 확대 순서로 갑니다. 그런데 이 권고가 틀릴 수도 있겠죠? 여기서 정책 엔진이 하는 일은 단순해 보여도 중요해요. 같은 입력이면 언제나 같은 판정이 나오고, 어떤 규칙이 그 판정을 냈는지도 남거든요. 감사 때 가장 먼저 묻는 게 바로 이거예요. 그 조건을 다음 장에 미리 적어 두었습니다.
    grid: {valign: middle}
    topic: 대안과 권고
    subtitle: "권고 — LLM은 설명·제안, 결정은 정책 엔진과 심사역"
    archetype: decision
    blocks:
