        items:
          - {icon: "azure:application-gateways", title: "WAF v2 Prevention", body: "OWASP DRS 2.1, 운영자 IP가 아니면 403"}
          - {icon: "azure:private-endpoints", title: Private Endpoint 전용, body: "Cosmos·Storage·Key Vault·Search·ACR·Service Bus"}
          - {icon: "azure:managed-identities", title: 무키 인증, body: "구성요소별 관리 ID와 RBAC, 비밀은 Key Vault"}
          - {icon: "fluent:lock_closed", title: 배포 창, body: "운영자 작업 때만 IP 하나를 잠시 허용하고 닫습니다"}
      - type: callout
        style: outline
        icon: "fluent:warning"
        text: "데모 한계: Easy Auth를 꺼 결정자가 고정 ID(demo-operator)로 기록됩니다. 운영 전환 시 Entra 복원이 첫 과제입니다."

  - layout: content
    notes: |
      네트워크 다음은 AI 고유의 위험이에요. 여섯 가지를 봤고, 오른쪽 칸에서 측정한 것과 완화만 한 것을 구분했습니다. 먼저 적요에 숨긴 간접 프롬프트 주입이에요. 적요는 데이터로만 다루고 결정은 정책과 심사역이 하니, 주입이 먹혀도 결정은 못 바꿉니다. 판별 가능한 두 건에서 숨은 지시를 따른 경우는 없었어요. 근거 없는 숫자는 결정적 근거 검사와 검토자 반성 루프로 막았고, 모델로 넘어간 요청 341건에서 개인정보는 하나도 나오지 않았습니다. 과도한 자율성은 도구 allowlist와 승인 스크립트로 묶었어요. 여기까지는 검증한 것들입니다. 반대로 주입 방어의 공백은 부분 완화예요. Prompt Shields가 1만 자 이하 입력만 보거든요. 모델 처리 위치도 데모 수준의 완화일 뿐입니다. 왜 이렇게 상태를 나눠 적었을까요? 전부 막았다고 쓰면 평가하시는 분은 무엇이 뚫릴 수 있는지 알 수 없기 때문이에요. 부분 완화로 적힌 칸이 곧 운영 전에 보강할 목록이고요. 표를 보실 때 검증된 줄과 완화만 한 줄의 개수를 비교해 보세요. 네 줄은 실제로 재서 확인했고, 두 줄은 아직 막았다고 말하기 어려운 상태예요. 이 비율을 숨기지 않는 게 책임 있는 AI의 출발이라고 생각합니다. 다음으로 데이터의 출발점인 동의가 어떻게 관리되는지 보겠습니다.
    grid: {valign: middle}
    topic: 보안·책임 있는 AI
    subtitle: AI 위험은 측정한 것과 완화만 한 것을 나눠 적었습니다
    archetype: failure
    blocks:
      - type: table
        row_h: 50
