  - layout: content
    notes: |
      이번엔 신청 한 건을 따라가 볼게요. 신청은 접수에서 시작해 동의 완료, 데이터 수집, 심사 지표 산출, 에이전트 평가를 거쳐 심사역 대기에서 멈춥니다. 승인이 나면 사후 모니터링으로 넘어가고요. 핵심은 사람이 결정해야 하는 지점에서 흐름이 반드시 멈춘다는 점이에요. 아래 세 카드가 그 방법입니다. 첫째, Durable Functions가 단계 순서와 재시도, 실패했을 때의 보상, 사람을 기다리는 HITL 대기까지 관리해요. 둘째, 단계 사이로 오가는 건 버전이 붙은 Pydantic 계약뿐입니다. 에이전트가 다른 에이전트를 직접 부르지 않으니 누가 무엇을 넘겼는지 항상 추적할 수 있어요. 셋째, 사내 도구는 VNet 안에서 오케스트레이터가 대신 실행하고 감사 로그를 남깁니다. 왜 이렇게까지 할까요? 감독기관이 특정 대출 결정을 물었을 때, 어떤 데이터와 어떤 규칙, 어떤 의견이 거기 있었는지 그대로 재생할 수 있어야 하거든요. 또 한 단계가 실패해도 처음부터 다시 돌릴 필요 없이 그 단계만 재시도할 수 있어요. 비용과 시간이 모두 줄어드는 거죠. 실제로 데모에서 진행 화면이 단계별로 바뀌던 게 바로 이 상태 그래프예요. 고객도 지금 어느 단계에 있는지 같은 그래프로 보게 됩니다. 그럼 이 단계 안에서 일하는 에이전트들을 하나씩 보겠습니다.
    grid: {valign: middle}
    topic: 솔루션 아키텍처
    subtitle: "신청 여정은 상태 그래프 — 사람이 결정하는 지점에서 멈춥니다"
