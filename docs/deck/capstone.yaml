    notes: |
      끝까지 들어 주셔서 감사합니다. 오늘 보신 데모와 보고서, ADR, 백서는 모두 저장소에서 다시 확인하실 수 있어요. 다음 단계는 오늘 요청드린 세 가지 결정에서 시작합니다. 이제 질문과 의견을 듣겠습니다. 숫자의 근거든 설계의 대가든 편하게 물어봐 주세요.
