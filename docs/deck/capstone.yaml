          - ["반품·환불 증가", 예상 정산액 축소, "반품·환불 사유와 정산 차감"]
          - ["광고비·매입비 증가", "매출 유지돼도 가용현금 감소", "광고비·매입비 지출 계획"]
          - ["예상 현금잔액 < 예정 상환액", 다음 상환일 자금 부족, "입금 예정과 다른 계좌 가용자금"]
