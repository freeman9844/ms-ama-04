          - [처리 시간, "접수 → 심사역 대기 p50/p95", "기관 API 지연, 자료 보완 왕복, 결정까지 전체"]
          - [경보 선행 기간, "첫 경보 → 연체일(평가 하네스)", "실제 연체 이력 백테스트, 섀도 운영"]
