deck:
  title: 에이전트 기반 현금흐름 대출
  theme: light
  level: L300
  mode: full
  duration_min: 45
  audience: "평가위원(아키텍트·경영진 역할) — CBO·CRO 관점의 의사결정자와 Azure 아키텍트"
  purpose: "Case Study 18 권고안: 문제 → 가치·위험 → 대안 → 권고, as-built Azure 데모 근거와 한계, 파일럿 요청"
  footer: "AMA Capstone · Case Study 18 · 합성 데이터 기준"
  company: "[회사]"
  job_title: "[직책]"
  presenter: "[발표자 이름]"
  date: "2026년 11월"
  output: capstone.pptx
  coverage:
    - "문제와 가치"
    - "대안과 권고"
    - "2분 데모|데모"
    - "솔루션 아키텍처"
    - "에이전트와 자율성"
    - "핵심 트레이드오프"
    - "보안·책임 있는 AI"
    - "사후 관리"
    - "평가와 운영"
    - "증명한 것과 못한 것"
    - "파일럿 계획과 요청"

slides:
  # ── 표지 ──────────────────────────────────────────────
  - layout: title
    notes: |
      안녕하세요, 이 캡스톤 과제를 설계하고 직접 Azure에 구현한 발표자입니다. 오늘은 Case Study 18, 에이전트 기반 현금흐름 대출에 대한 권고안을 말씀드리려고 해요. 재무제표가 없는 디지털 소기업에게 어떻게 하면 빠르고 안전하게 돈을 빌려줄 수 있을까요? 이 질문에 실제로 돌아가는 Azure 데모로 답해 보겠습니다. 시간은 45분이고, 질문은 마지막에 충분히 받겠습니다.
    title: "에이전트 기반\n현금흐름 대출"
    subtitle: "Azure Master Architect Capstone · Case Study 18"

  - layout: agenda
    notes: |
      오늘 이야기는 네 부분으로 나눠 갑니다. 먼저 왜 지금 이 일을 해야 하는지, 대안을 어떻게 비교했고 무엇을 권하는지 말씀드린 뒤 짧은 데모를 보여드릴게요. 두 번째는 Azure 구성과 에이전트들, 그리고 설계하면서 치른 대가예요. 세 번째는 믿을 수 있느냐의 문제로, 보안과 책임 있는 AI, 대출 이후의 경보와 추심, 운영 지표를 다룹니다. 마지막으로 데모가 증명한 것과 못한 것을 솔직하게 나누고, 파일럿과 요청 사항으로 마무리하겠습니다. 그럼 숫자 하나로 시작해 볼까요?
    title: 오늘의 흐름
    blocks:
      - type: agenda
        numbered: true
        items:
          - {title: "왜 지금, 무엇을 권하나", sub: "문제·가치·미추진 비용 → 대안 4개 → 권고 → 2분 데모"}
          - {title: 아키텍처와 에이전트, sub: "Azure 구성·9개 에이전트와 자율성·핵심 트레이드오프"}
          - {title: 신뢰와 사후 관리, sub: "보안·책임 있는 AI·조기경보→추심 승인·평가와 운영 지표"}
          - {title: 증명 범위와 다음 단계, sub: "보인 것과 못 보인 것·파일럿 계획·의사결정 요청"}

  - layout: statement
    notes: |
      방금 말씀드린 흐름의 출발점은 숫자 하나예요. 6,000달러짜리 대출 한 건을 내주려고 3,500달러를 쓴다면 어떨까요? 대출액의 절반이 훌쩍 넘는 돈이 심사와 취급에만 들어가는 셈입니다. 이 원가는 업계 연구를 바탕으로 둔 가정이지만, 방향은 분명해요. 게다가 지금은 처리에 2주가 걸리고, 부실 경보는 부도가 난 그 시점에야 옵니다. 고객은 그 2주를 기다려 주지 않고 더 빠른 핀테크로 가 버리죠. 오른쪽 끝 숫자도 함께 보세요. 신용비용을 100bp만 줄여도 이 은행의 목표 자산 규모에서는 매년 수백만 달러가 남습니다. 지금 구조로는 이 기회를 잡을 수가 없어요. 아래에는 원문이 요구한 목표 네 가지를 적어 두었습니다. 원가를 줄이고, 처리를 이틀 안으로 당기고, 경보를 두세 달 앞당기고, 손실을 낮추는 것이죠. 오늘 발표는 이 네 목표를 기준으로, 무엇을 증명했고 무엇을 아직 못 했는지 말씀드리는 자리예요. 네 목표 중 어느 것도 기술만으로는 닫히지 않는다는 점을 기억해 두시면 뒤의 이야기가 더 잘 들리실 겁니다. 숫자 하나하나보다 중요한 건 이 네 숫자가 서로 묶여 있다는 점이에요. 원가가 높으니 소액 대출을 못 하고, 소액 대출을 못 하니 데이터가 쌓이지 않고, 데이터가 없으니 경보도 늦어지는 악순환이죠. 그럼 첫 번째 파트로 들어가 보겠습니다.
    grid: {valign: middle}
    title: "6,000달러 대출에 3,500달러를 쓰는 구조로는\n이 시장에 들어갈 수 없습니다"
    blocks:
      - type: stats
        style: card
        h: 240
        value_size: 52
        items:
          - {value: "$3,500", label: 수작업 취급 원가(가정), sub: "대출액의 58%"}
          - {value: 2주, label: 현재 처리 기간, sub: "목표 48시간"}
          - {value: 부도 시점, label: 지금의 부실 경보, sub: "목표 60~90일 전"}
          - {value: "$3M~5M", label: "연 신용비용 100bp", sub: "자산 3억~5억 달러 기준"}
      - type: callout
        style: bar
        icon: "fluent:target"
        title: 원문 목표
        text: "취급 비용 60% 절감 · 처리 2주 → 48시간 · 부도 60~90일 전 경보 · 신용비용 100bp 절감"

  # ── 01 왜 지금, 무엇을 권하나 ──────────────────────────
  - layout: section
    notes: |
      첫 번째 파트에서는 왜 지금이고 무엇을 권하는지 다룹니다. 문제를 고객과 경영진 관점에서 먼저 보고, 원문 목표를 데모가 실제로 잰 값과 맞춰 볼게요. 그다음 네 가지 대안을 같은 잣대로 비교하고, 권고안과 그 권고를 철회할 조건까지 말씀드린 뒤 데모로 넘어가겠습니다. 먼저 문제부터 볼까요?
    section_no: "01"
    title: "왜 지금, 무엇을 권하나"
    subtitle: 문제와 가치 · 대안 비교 · 권고 · 2분 데모

  - layout: content
    notes: |
      앞에서 본 3,500달러가 왜 생기는지, 고객 쪽부터 짚어 볼게요. 이 은행이 노리는 고객은 온라인 셀러 같은 디지털 소기업입니다. 이분들은 감사받은 재무제표는 없지만, 오픈뱅킹 거래와 세금 신고, PG 정산 기록은 매일 쌓이고 있거든요. 그런데 지금 심사는 대형 차주에게 쓰던 재무제표 분석을 사람이 그대로 하고 있어요. 데이터가 없어서가 아니라, 있는 데이터를 쓸 방법이 없어서 생기는 문제인 거죠. 그러니 오래 걸리고, 소액 대출은 내주는 단계에서 이미 손해가 납니다. 경보도 너무 늦게 오고요. [아래 두 카드를 가리키며] 이 문제를 바라보는 경영진은 두 명입니다. CBO는 대출자산을 3억에서 5억 달러 늘리고, 6,000달러짜리 대출 한 건 한 건에서 돈을 벌고 싶어 해요. CRO는 신용비용을 100bp 줄이면서, 왜 그렇게 결정했는지 설명하고 고객의 이의에도 답할 수 있어야 하고요. 두 사람의 요구는 자주 부딪힙니다. 빠르게 하면 통제가 약해지고, 통제를 세우면 느려지죠. 그래서 오늘 권고안은 속도와 통제를 둘 다 지키는 구조를 보여드리는 데 초점을 맞췄습니다. 결국 이 고객군은 위험해서가 아니라 심사 비용이 비싸서 외면받고 있는 셈이에요. 그 비용 구조를 바꾸는 게 오늘 이야기의 출발점입니다. 그럼 원문 목표를 데모가 어디까지 쟀는지 표로 확인해 보겠습니다.
    grid: {valign: middle}
    topic: 문제와 가치
    subtitle: 기록은 풍부한데 심사는 대형 차주용 수작업 재무제표 분석입니다
    archetype: mapping
    blocks:
      - type: cards
        body_size: 16
        style: accent-top
        columns: 3
        items:
          - icon: "fluent:person"
            title: 고객 — 디지털 소기업
            body: "재무제표는 없지만 오픈뱅킹 거래·세금 신고·PG 정산 흐름이 풍부합니다"
          - icon: "fluent:document_checkmark"
            title: 현재 심사 — 수작업
            body: "대형 차주용 재무제표 분석 그대로라 처리에 2주가 걸립니다"
          - icon: "fluent:arrow_trending_down"
            title: 결과 — 진입 불가
            body: "소액 대출은 취급 단계에서 적자이고, 경보는 부도 시점에 옵니다"
      - type: cards
        body_size: 16
        style: icon-left
        columns: 2
        items:
          - icon: "fluent:data_trending"
            title: CBO — 성장·수익성
            body: "대출자산 3억~5억 달러 확대, 건당 6,000달러 단위 경제"
          - icon: "fluent:shield_checkmark"
            title: CRO — 신용비용·통제
            body: "신용비용 100bp 절감, 설명 가능한 결정과 이의 경로"

  - layout: content
    notes: |
      그럼 목표 다섯 개를 하나씩 데모 측정값과 맞대 볼게요. 이 표에서 가장 중요한 건 오른쪽 판단 칸입니다. 취급 비용은 신청 한 건의 AI 비용에 고정비를 나눠 붙여서 쟀고, 월 1,000건 기준으로 한 건에 88센트가 나왔어요. 다만 심사역 인건비는 재지 않았습니다. 처리 시간은 접수부터 심사역 대기열까지 p95가 1.2분인데, 스물네 건을 잰 결과이고 자동화 구간만의 숫자예요. 경보는 합성 연체일보다 평균 70일 남짓 앞서 울려서 목표 범위인 60일에서 90일 안에 들어왔지만, 실제 부도 이력으로 돌려 본 적은 없습니다. 신용비용은 직접 잴 수 없어서 경보의 정밀도와 재현율을 간접 근거로만 두었고, 자산 성장은 애초에 데모가 잴 수 있는 범위 밖이에요. 왜 굳이 한계를 같은 줄에 적었을까요? 숫자를 보시면 바로 무엇을 뺐느냐고 물으실 테니까요. 숫자와 한계를 나란히 두면 과장 없이 논의할 수 있고, 어떤 칸을 파일럿에서 채워야 하는지도 바로 보입니다. 표를 읽는 방법도 하나 말씀드릴게요. 판단 칸에 범위 안이라고 적힌 줄은 데모가 직접 보인 것이고, 미측정이나 간접 근거라고 적힌 줄은 파일럿에서 채울 숙제입니다. 다섯 줄 중 깨끗하게 증명된 건 사실 많지 않아요. 그럼 이 숫자들이 돈으로는 어떤 의미인지 단위 경제로 바꿔 보겠습니다.
    grid: {valign: middle}
    topic: 문제와 가치
    subtitle: 원문 목표와 데모가 실제로 잰 값을 나란히 놓았습니다
    archetype: comparison-table
    blocks:
      - type: table
        row_h: 56
        columns: [원문 목표, 데모가 잰 것, 측정값(합성 데이터), 판단]
        col_widths: [2.2, 2.4, 2.6, 2.8]
        size: 14
        symbols: false
        rows:
          - ["취급 비용 −60%", "신청 1건의 AI 비용 + 고정비 분담", "월 1,000건 약 $0.88/건", "기술 비용은 작음. 심사역 인건비는 미측정"]
          - ["2주 → 48시간", "접수 → 심사역 대기열", "p95 1.2분(n=24)", "자동화 구간만. 심사역 검토 시간 제외"]
          - ["부도 60~90일 전 경보", "첫 경보 → 합성 연체일", "평균 70.5~71.7일", "범위 안. 실제 부도 이력 백테스트 없음"]
          - ["신용비용 −100bp", "직접 측정 불가", "경보 precision·recall 1.000", "간접 근거만"]
          - ["대출자산 +3억~5억 달러", "측정 범위 밖", "—", "사업 계획 수치"]

  - layout: content
    notes: |
      방금 본 88센트를 원가 구조 안에 놓아 볼게요. 출발점은 사람이 처리할 때의 원가 3,500달러이고, 업계 연구를 바탕으로 둔 가정입니다. 원문 목표대로 60%를 줄이면 한 건에 1,400달러까지 내려가야 해요. 그 안에서 데모의 기술 비용은 1달러도 되지 않습니다. 월 1,000건 기준으로 AI 호출과 고정비를 다 합친 값이에요. 그러면 1,399달러가 남는데, 이게 심사역 시간과 운영, 자금 조달에 쓸 수 있는 예산이죠. 여기서 어떤 결론을 내릴 수 있을까요? AI 비용을 몇 센트 더 깎는 건 승부를 가르지 않습니다. 진짜 질문은 심사역이 한 건을 보는 시간이 얼마나 줄어드느냐예요. 데모는 그 시간을 재지 않았고, 그래서 이 부분을 파일럿의 첫 번째 측정 항목으로 넘겼습니다. 거꾸로 말하면 모델을 더 좋은 것으로 바꿔도 단위 경제는 거의 흔들리지 않는다는 뜻이기도 해요. 품질을 위해 비용을 조금 더 쓰는 결정이 여기서는 정당화되는 거죠. 뒤에서 게이트웨이 비용이 오른 이야기를 할 때도 이 기준으로 판단했습니다. 숫자로 다시 말씀드리면, 기술 비용은 목표 원가의 0.1%도 되지 않습니다. 그러니 이 사업의 성패를 기술 비용으로 설명하는 보고서가 있다면 한 번쯤 의심해 보셔야 해요. 이어서 하지 않을 때 잃는 것과, 이 문제를 풀 대안들을 차례로 보겠습니다.
    grid: {valign: middle}
    topic: 문제와 가치
    subtitle: 단위 경제 — 남는 1,399달러가 실제 승부처입니다
    archetype: numbers
    blocks:
      - type: stats
        style: card
        items:
          - {value: "$3,500", label: 수작업 원가(가정), sub: "업계 연구 기반 가정"}
          - {value: "$1,400", label: "−60% 목표 원가", sub: "$3,500 × 0.4"}
          - {value: "$0.88", label: 데모 기술 비용, sub: "월 1,000건, AI + 고정비"}
          - {value: "$1,399", label: 남는 예산, sub: "심사역·운영·조달 비용"}
      - type: callout
        style: bar
        icon: "fluent:lightbulb"
        title: 의미
        text: "기술 비용은 목표 원가의 0.1% 미만입니다. 60% 절감 여부는 심사역 검토 시간과 운영 비용이 정하며, 데모는 이 부분을 재지 않았습니다."

  - layout: content
    notes: |
      조금 더 깊게 들어가 보면, 하지 않는 것에도 비용이 있습니다. 첫째는 시장이에요. 핀테크는 이미 거래 흐름으로 심사를 하고 있고, 오픈뱅킹으로 볼 수 있는 범위는 매달 넓어지고 있죠. 우리가 기다리는 동안 그 고객군을 먼저 가져가고, 그만큼 3억에서 5억 달러의 자산 확대 기회도 줄어듭니다. 둘째는 신용비용이에요. 경보가 부도 시점에 오는 구조로는 손을 쓸 시간이 없습니다. 100bp는 대출 한 건으로 보면 1년에 60달러지만, 자산 전체로 곱하면 매년 3백만에서 5백만 달러가 되죠. 셋째는 원가 구조예요. 취급에만 대출액의 58%를 쓰면 이 고객군은 들어가는 순간 손해입니다. 한 가지 분명히 해 둘 점이 있어요. 이 세 숫자는 원문의 사업 가정에서 나온 값이지, 데모가 잰 값이 아닙니다. 의사결정에는 쓰되 측정값처럼 말하지 않으려고 이렇게 따로 표시했어요. 질문을 받으시면 이 구분을 꼭 함께 말씀해 주시는 게 좋습니다. 이 장을 보여드리는 이유는 겁을 드리려는 게 아니에요. 아무것도 하지 않는 것도 하나의 선택이고, 그 선택에도 분명한 가격표가 붙어 있다는 걸 다른 대안과 같은 저울에 올리려는 겁니다. 대안 비교표의 첫 줄이 수작업 유지인 것도 그래서예요. 그럼 원래 흐름으로 돌아가서, 이 문제를 풀 대안 네 가지를 비교해 보겠습니다.
    grid: {valign: middle}
    topic: 문제와 가치
    subtitle: "하지 않으면 잃는 것 — 시장, 신용비용, 원가 구조"
