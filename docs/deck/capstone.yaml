  - layout: content
    notes: |
      방금 본 루프 바깥에도 안전장치가 있습니다. 조금 더 깊게 들어가 보면, 가드레일은 프롬프트 한 줄이 아니라 다섯 겹의 코드예요. 첫 겹은 입력입니다. 모델로 가기 전에 상호와 대표자, 사업자번호, 적요 속 이름까지 가명으로 바꾸고, 적요는 지시가 아니라 데이터로만 다뤄요. 두 번째는 도구예요. allowlist에 있는 것만 쓸 수 있고, 쓰기 도구는 경보와 제안 외엔 없습니다. Code Interpreter 컨테이너도 쓰고 나면 바로 지워요. 세 번째는 출력이에요. 사람에게 가기 전에 근거 ID와 숫자를 대조하고, 금지 표현과 300자 상한, 가명 토큰이 새는지 검사하죠. 네 번째는 APIM 게이트웨이입니다. 에이전트별 TPM 한도와 Prompt Shields, 토큰 지표를 걸었어요. 마지막 겹은 결정 자체가 LLM 밖에 있다는 점입니다. Policy Engine의 reason code와 심사역의 승인, 거절이 최종이죠. 한 겹이 뚫려도 다음 겹이 받치도록 한 거예요. 프롬프트는 모델이 바뀌면 효과가 달라지지만, 코드는 그대로 남거든요. 실제로 평가에서 주입 시도가 있었을 때도 이 겹들이 차례로 받쳤어요. 결과는 뒤의 AI 위험 표에서 다시 보실 수 있습니다. 이제 원래 흐름으로 돌아가서, 이런 구조를 만들며 치른 대가를 ADR로 보겠습니다.
