  - layout: content
    notes: |
      비용을 멈추고 켜는 이야기가 나온 김에 운영 절차도 짧게 보여드릴게요. 조금 더 깊게 들어가 보면, 이 모든 운영은 런북 명령 몇 개로 반복할 수 있게 해 두었습니다. 왼쪽 코드 순서대로 보시면 돼요. 먼저 ops window open으로 운영자 IP 하나만 잠시 허용하고, 오케스트레이터와 콘솔을 배포합니다. 그다음 ops smoke가 VNet 안의 Job으로 전 경로를 점검하고, window close로 임시 규칙을 지워요. 마지막으로 ops report가 SLO와 건당 비용, 공정성을 한 번에 뽑습니다. 오른쪽은 운영을 받치는 세 가지예요. 관측은 App Insights와 Log Analytics, WAF 접근 로그, 에이전트별 토큰 지표로 하고, 비용 정지는 pause가 5.8분, resume이 4.7분 걸려요. 평가는 VNet 안 Container Apps Job으로 돌고 예산 상한은 5달러입니다. 사람이 손으로 하던 순서를 명령으로 묶어 두니 실수가 줄고, 누가 해도 같은 결과가 나와요. 창을 열어 둔 채 잊어버릴 위험도 함께 줄고요. 이 명령들은 데모 기간 내내 실제로 썼던 것이라, 운영팀에 넘길 때도 그대로 인수인계 문서가 됩니다. 새 담당자가 와도 같은 순서를 따라 하면 되는 거죠. 이제 마지막 파트로 넘어가겠습니다.
