    notes: |
      방금 표의 숫자들이 어디서 왔는지 궁금하실 수 있어요. 조금 더 깊게 들어가 보면, 오늘 보여드린 숫자는 모두 저장소 안의 재현 가능한 보고서에서 나왔습니다. 부하와 SLO 보고서는 ops report 한 번으로 p50과 p95, 단계 성공률, 건당 비용, 공정성을 뽑아요. 평가 하네스 보고서는 ops eval로 분류와 심사, 조기경보, 보안 평가를 돌립니다. 설계 결정은 ADR 열한 건에 대안과 대가, 재검토 조건까지 적혀 있고, 위협 모델에는 STRIDE와 AI 위험별 통제, 증거, 상태가 있어요. 운영 런북에는 배포 창과 스모크, 일시정지와 장애 대응 절차가 있고요. 그리고 이 과제에서 얻은 일곱 가지 설계 원칙을 사고 리더십 백서로 따로 정리했습니다. 평가하시는 분이 어떤 숫자든 직접 다시 돌려 보실 수 있다는 게 이 장의 요점이에요. 발표에서 말한 숫자와 보고서 숫자가 다르면 보고서가 맞습니다. 그만큼 보고서를 기준으로 삼았어요. 이렇게까지 하는 이유는, 발표 자료의 숫자는 손으로 옮기다 틀어지기 쉽기 때문이에요. 보고서가 원본이고 발표는 그걸 옮긴 것이라는 원칙을 지켜야, 몇 달 뒤 다시 봐도 같은 결론이 나옵니다. 파일럿 보고서도 같은 방식으로 만들 계획이에요. 이제 원래 흐름으로 돌아가 파일럿 계획을 보겠습니다.
