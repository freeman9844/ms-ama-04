  - layout: content
    notes: |
      먼저 보안은 두 가지 질문으로 정리할 수 있어요. 누가 들어올 수 있나, 그리고 들어와서 무엇에 닿을 수 있나. 첫 카드는 입구입니다. WAF v2를 Prevention 모드로 두고 OWASP DRS 2.1 규칙을 걸었고, 운영자 IP가 아니면 403을 돌려줘요. 두 번째는 데이터 쪽입니다. Cosmos, Storage, Key Vault, Search, ACR, Service Bus 모두 Private Endpoint로만 닿아요. 세 번째는 인증입니다. 키를 쓰지 않고 구성요소마다 관리 ID와 RBAC를 줬고, 남는 비밀은 Key Vault에 있어요. 네 번째는 배포 창이에요. 운영자가 작업할 때만 IP 하나를 잠깐 열고 바로 닫습니다. 그런데 꼭 말씀드려야 할 한계가 있어요. 데모에서는 Easy Auth를 꺼 둬서, 승인한 사람이 실제 사람이 아니라 demo-operator라는 고정 ID로 기록됩니다. 결정권 분리를 강조하는 설계에서 이건 큰 구멍이죠. 누가 승인했는지 모르면 사람이 결정한다는 말도 증명할 수 없으니까요. 그래서 운영 전환 때 Entra 복원을 첫 번째 과제로 두었습니다. 정리하면 평상시에 열린 문은 WAF 하나이고, 나머지는 필요할 때만 잠깐 열립니다. 이 원칙은 운영에서도 그대로 유지해요. 그럼 AI 고유의 위험은 어떻게 다뤘는지 보겠습니다.
    grid: {valign: middle}
    topic: 보안·책임 있는 AI
    subtitle: "네트워크와 신원 — 평상시 열린 문은 WAF 하나입니다"
    archetype: identity
    blocks:
      - type: cards
        body_size: 16
        style: icon-left
