          - {label: 여신 심사, left: "L2 · 1개", right: "L2 · 분류 + 분석가 + 검토자", relation: to, note: "최대 3라운드 반성 루프"}
          - {label: 조기경보, left: "L4 · 경보 발송", right: "L4 · 경보 + 단계 안내", relation: eq, note: "안내는 결정적 정책"}
          - {label: 추심, left: "L3 · 직접 발송", right: "L3 · 제안만", relation: to, note: "발송은 심사역 승인"}
          - {label: 동의 수명주기, left: "L4 · 1개", right: "L4 동의 안내 + L3 이의 회신", relation: to, note: "삭제는 오케스트레이터"}

  - layout: content
    notes: |
      방금 말씀드린 반성 루프를 열어 보면, 심사 의견은 한 번 쓰고 끝나지 않습니다. 가운데 그림을 따라가 볼게요. 분석가 에이전트가 gpt-5.6-sol로 도구 네 개와 Code Interpreter를 써서 의견을 쓰면, 먼저 결정적인 근거 검사가 숫자를 원본과 대조합니다. 허용 오차는 2%예요. 그다음 검토자 에이전트가 주장 하나하나에 근거가 있는지 예, 아니오로 봅니다. 통과하면 심사역에게 가고, 지적이 있으면 분석가가 다시 써요. 세 라운드를 넘기면 그 상태 그대로 심사역에게 넘기고요. 무한히 돌지 않게 상한을 둔 거죠. 위쪽 숫자는 분석가 모델을 바꾼 효과예요. 첫 라운드 근거 통과가 gpt-5.4의 75%에서 100%로 올랐고, 평균 라운드는 2.00에서 1.12로 줄었습니다. 평가서 한 건 비용도 9.84센트에서 7.83센트로 오히려 내려갔어요. 더 좋은 모델이 더 싸진 셈인데, 왜 그럴까요? 고쳐 쓰는 횟수가 줄었기 때문입니다. 다만 합성 케이스를 한 번 돌린 결과라 경향으로만 봐 주세요. 이 루프의 핵심은 검토자보다 앞에 있는 결정적 검사예요. 숫자가 틀리면 모델이 아무리 그럴듯하게 써도 코드가 먼저 걸러내니까요. 검토자는 그다음 단계입니다. 그럼 이런 판단 위에 어떤 안전장치가 겹겹이 있는지, 그리고 그 설계의 대가를 차례로 보겠습니다.
