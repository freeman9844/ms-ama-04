  - layout: content
    notes: |
      방금 오른쪽 칸을 실측하려면, 먼저 닫아야 할 위험이 여섯 가지 있어요. 위에서부터 짧게 볼게요. 첫째는 데모 인증입니다. Easy Auth가 꺼져 고정 결정자 ID라서, 심사역은 Entra로, 고객은 External ID로 바꿔야 해요. 둘째, 데이터가 합성입니다. Mock API와 합성 셀러 21곳 대신 실제 마이데이터, 홈택스, PG를 붙여야 하죠. 셋째, 표본이 작아요. SLO는 24건, 공정성은 값별 8건이라 섀도 모드에서 다시 재야 합니다. 넷째, 모델 처리 위치는 Data Zone이나 국내 배포로 다시 평가해요. 다섯째, 게이트웨이는 APIM Developer라 SLA가 없으니 Standard v2 이상, 다중 리전으로 올립니다. 여섯째, TLS는 자체 서명 인증서라 공인 CA와 사용자 도메인으로 바꿔야 해요. 이 목록에서 무엇이 보이시나요? 대부분 설계를 바꾸는 일이 아니라 데모용 설정을 운영용으로 올리는 일입니다. 구조는 그대로 두고 Bicep 파라미터와 연동만 바꾸면 돼요. 그래서 0단계 준비 기간을 길게 잡지 않아도 됩니다. 표의 위험 상당수는 앞에서 이미 한계로 말씀드린 것들이에요. Easy Auth, 모델 처리 위치, 작은 표본이 그렇죠. 새로 발견한 문제가 아니라 처음부터 알고 관리해 온 목록입니다. 이 숫자들의 출처와 파일럿 계획을 이어서 보겠습니다.
