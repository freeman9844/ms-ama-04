          - {title: CRO에게, body: "결정권은 LLM 밖, 모든 판단에 근거 ID"}
          - {title: 도입 방식, body: "섀도 모드 → 제한 파일럿 → 확대"}

  - layout: content
    notes: |
      그럼 이 권고가 틀렸다고 판단할 조건을 볼게요. 철회 조건을 미리 정해 두는 건 경영진께 드리는 일종의 안전장치예요. 세 가지 경우를 정했습니다. 첫 번째는 규칙만으로 충분한 경우예요. 지금도 거래 분류의 80%는 규칙이 처리하고 있거든요. 파일럿에서 에이전트 의견이 실제 결정을 한 번도 바꾸지 못한다면, 굳이 에이전트를 쓸 이유가 없으니 규칙 스코어카드로 줄이겠습니다. 두 번째는 심사역 시간이 줄지 않는 경우입니다. 앞에서 본 것처럼 기술 비용은 작아서, 사람 시간이 그대로면 60% 절감의 근거가 사라져요. 그때는 범위를 좁혀야죠. 세 번째는 모델 처리 위치를 법무에서 허용받지 못하는 경우입니다. 이때는 국내에 배포되는 모델이 나올 때까지 섀도 모드로만 운영해요. 이렇게 미리 써 두면 파일럿 결과를 놓고 해석 싸움을 할 필요가 없습니다. 판단 기준이 결과보다 먼저 정해져 있으니까요. 또 하나, 실패해도 투자가 통째로 버려지지 않는다는 점도 중요해요. 규칙 엔진과 데이터 수집은 어느 경우든 그대로 쓰입니다. 이 세 조건은 모두 파일럿 중에 확인할 수 있는 것들이라는 공통점이 있어요. 막연한 성공 여부가 아니라, 확인 가능한 기준으로 계속할지 멈출지를 정하자는 제안입니다. 자, 그럼 말로만 설명하지 않고 실제로 돌아가는 모습을 2분 동안 보여드리겠습니다.
    grid: {valign: middle}
