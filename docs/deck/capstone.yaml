          - ["txn-classifier", 거래 분류, L2, "Decision-1 + luna", 없음]
          - ["underwriting-analyst", 신용 평가, L2, gpt-5.6-sol, 없음]
          - ["underwriting-reviewer", 신용 평가, L2, gpt-5.6-luna, 없음]
          - ["early-warning-investigator", 사후 조기경보, L4, gpt-5.6-luna, "raise_alert(경보)"]
          - ["collections-agent", 사후 추심, "L3 → 제안만", gpt-5.6-luna, "propose(제안), 발송은 심사역"]
          - ["consent-notice-agent", 동의 안내, L4, gpt-5.6-luna, 없음]
          - ["grievance-reply-agent", 이의 회신, L3, gpt-5.6-luna, 없음]
          - ["officer-assistant", 심사역 채팅, L1, gpt-6-luna, "없음(가명 스냅샷)"]

  - layout: content
    notes: |
      앞에서 본 아홉 개는 원문의 다섯 개에서 나왔어요. 저희는 그 뼈대를 유지하되 역할별로 쪼개고, 한 곳은 일부러 더 보수적으로 바꿨습니다. 데이터 취합은 L3 그대로인데, 데이터가 다 모였는지 판단하는 완결성 계산은 모델이 아니라 코드가 하게 했어요. 여신 심사는 L2 하나였던 걸 분류, 분석가, 검토자 셋으로 나눴고, 최대 세 라운드까지 고쳐 쓰는 반성 루프를 넣었습니다. 조기경보는 원문대로 L4로 경보를 스스로 내되, 고객에게 가는 단계 안내는 결정적 정책이 맡아요. 가장 크게 바꾼 곳은 추심입니다. 원문은 L3에서 직접 연락하도록 했는데, 저희는 제안까지만 하고 실제 발송은 심사역이 승인하게 했어요. 왜 자율성을 낮췄을까요? 연체 고객에게 가는 연락은 공정 추심 규제와 평판 위험이 가장 큰 접점이기 때문입니다. 실수 한 번이 민원과 제재로 바로 이어질 수 있거든요. 동의 수명주기도 L4 안내와 L3 이의 회신으로 나눴고, 삭제 자체는 오케스트레이터가 하도록 했습니다. 정리하면, 쪼갠 곳은 품질 때문이고 낮춘 곳은 위험 때문이에요. 원문 설계를 그대로 따르지 않은 부분은 이렇게 표로 드러내서, 무엇을 왜 바꿨는지 한눈에 보실 수 있게 했습니다. 바꾼 이유는 모두 ADR에 남아 있어요. 그럼 심사 쪽 반성 루프가 실제로 어떻게 도는지 숫자로 보겠습니다.
    grid: {valign: middle}
    topic: 에이전트와 자율성
    subtitle: 원문 5개 에이전트를 역할별로 나누고, 추심은 더 보수적으로 바꿨습니다
