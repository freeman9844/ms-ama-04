          - {title: 정책 엔진이 판정, body: "버전드 YAML 규칙, reason code, 실패 시 fail-closed", icon: "fluent:scales"}
          - {title: 심사역이 결정, body: "승인·거절, 추심 발송 승인·수정·반려", icon: "fluent:gavel"}
      - type: cards
