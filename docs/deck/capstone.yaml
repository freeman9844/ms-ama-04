          - {title: 안내, body: "만료 예정과 삭제 완료 알림", icon: "fluent:chat"}
          - {title: 삭제, body: "만료·철회 시 원천 데이터 삭제", icon: "fluent:lock_closed"}
          - {title: 증명, body: "삭제 증명 + 판단 기록 보존", icon: "fluent:shield_checkmark"}
