          - {left: "동의 만료 시 원천 삭제 + 삭제 증명", right: "파생값·근거 ID 보존 범위는 법무 확인 필요"}
          - {left: "SKU는 Bicep 파라미터로 전환 가능", right: "Data Zone·국내 배포 가용성은 모델마다 다름"}
