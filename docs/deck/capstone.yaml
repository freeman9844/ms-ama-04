  - layout: content
    notes: |
      게이트웨이가 비용 문제였다면, 남은 하나는 데이터를 어디서 처리하느냐예요. 조금 더 깊게 들어가 보면, 데이터 주권과 설명 가능성은 서로 당기는 관계입니다. 왼쪽은 저희가 지키는 것이고 오른쪽은 아직 남는 위험이에요. 데이터는 Korea Central에 저장하지만, Global Standard 추론은 처리 위치를 보장하지 않아요. 그래서 모델에는 가명화한 최소 데이터만 보냅니다. 그런데도 Foundry 트레이스에는 가명 프롬프트가 남아요. 동의가 만료되면 원천은 지우고 삭제 증명을 남기지만, 설명을 위해 남기는 파생값과 근거 ID를 어디까지 보존할지는 법무 확인이 필요하죠. 모델 SKU는 Bicep 파라미터 하나로 바꿀 수 있게 해 두었는데, Data Zone이나 국내 배포가 되는지는 모델마다 달라요. 결국 기술로 닫을 수 있는 건 여기까지이고, 나머지는 법무의 판단이 필요한 영역입니다. 그래서 아래에 ADR-002의 재검토 조건을 적었어요. 운영 전환 전에 처리 위치를 법무와 함께 다시 정합니다. 이 결정이 앞에서 말씀드린 세 번째 철회 조건과 같은 이야기라는 점도 기억해 주세요. 여기서 무리하게 기술로 다 해결했다고 말하지 않는 게 중요하다고 봤어요. 그래야 법무와 같은 언어로 이야기할 수 있으니까요. 이제 본래 흐름으로 돌아가 세 번째 파트, 신뢰와 사후 관리를 보겠습니다.
