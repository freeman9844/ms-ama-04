          - ["근거 없는 숫자", "결정적 근거 검사 + 검토자 반성 루프", "검증"]
          - ["PII 모델 전송", "전송 전 가명화, 응답 후 복원", "payload PII 0/341"]
          - ["과도한 자율성", "도구 allowlist, 추심은 승인 스크립트만", "검증"]
          - ["주입 방어 공백", "Prompt Shields(1만 자 이하만)", "부분 완화"]
          - ["모델 처리 위치", "가명화·최소 전송·국내 저장", "데모 완화"]

  - layout: content
    notes: |
      앞에서 데이터를 어떻게 지키는지 봤다면, 이번엔 그 데이터를 언제까지 쓸 수 있느냐예요. 대출 데이터는 동의에서 시작해서 삭제 증명으로 끝납니다. 위쪽 다섯 단계를 따라가 볼게요. 고객은 은행, 세무, PG 세 가지 동의를 따로 하고, 각 동의에는 범위와 만료가 담긴 HMAC 서명 토큰이 붙어요. 수집할 때 동의하지 않은 원천을 열려고 하면 scope_not_consented로 거부되고 멈춥니다. 만료가 다가오면 안내 에이전트가 미리 알리고, 삭제가 끝나면 그것도 알려 드려요. 만료나 철회가 되면 원천 데이터를 지우고, 지웠다는 증명과 판단 기록은 남깁니다. 아래 두 카드는 고객에게 드리는 약속이에요. 여러 동의를 하나로 묶어 받는 다크 패턴은 쓰지 않았고, 철회도 같은 화면에서 할 수 있습니다. 이의가 들어오면 회신 에이전트는 고객이 쓴 글이 아니라 판단 기록만 근거로 답해요. 고객 글에 숨은 지시에 휘둘리지 않게 하려는 거죠. 데모 마지막 장면에서 보신 삭제 증명이 바로 이 흐름의 끝입니다. 이렇게 지우면서도 설명은 남겨야 하는 긴장은 앞에서 본 ADR과 같은 이야기예요. 기술적으로는 삭제보다 삭제를 증명하는 쪽이 더 어려웠어요. 무엇을 지웠고 무엇을 왜 남겼는지 기록으로 보여 줄 수 있어야 하니까요. 그럼 공정성은 어떻게 쟀는지 보겠습니다.
    grid: {valign: middle}
    topic: 보안·책임 있는 AI
    subtitle: 동의는 범위·만료가 있고, 만료되면 지우고 증명합니다
