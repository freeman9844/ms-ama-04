          - {title: 설명되는 격차, body: "업력 50pp는 업력 규칙 R104가 설명합니다"}
          - {title: 정직한 해석, body: "값별 8건뿐이라 파일럿에서 다시 측정합니다"}

  - layout: content
    notes: |
      이제 대출이 나간 다음을 볼게요. 대출 당시엔 상환능력이 충분했더라도, 매출과 비용, 정산은 그 뒤에 얼마든지 달라질 수 있죠. 조기경보 에이전트는 그 변화를 미리 찾는 역할이에요. 표는 마켓플레이스 셀러를 기준으로 본 네 가지 신호입니다. 판매대금 입금이 줄면 상환재원이 줄 수 있고, 반품과 환불이 늘면 받을 정산액이 줄어요. 광고비나 매입비가 늘면 매출은 그대로여도 쓸 수 있는 현금이 줄고요. 가장 직접적인 건 예상 현금잔액이 다음 상환액에 못 미치는 경우입니다. 핵심은 세 번째 칸이에요. 경보는 위험하다는 표시로 끝나지 않고, 무엇을 확인해야 하는지까지 적습니다. 아래 예시처럼 정산이 일주일 늦어져 다음 상환일에 돈이 모자랄 것 같으니, 정산 상태와 다른 계좌를 확인하라는 식이죠. 왜 이렇게 쓸까요? 심사역이 경보를 받고 다시 데이터를 뒤질 필요가 없게 하려는 거예요. 경보 하나에 몇 분씩 쓰면 사람 비용이 다시 늘어나니까요. 이건 앞에서 본 단위 경제와도 바로 이어집니다. 여기서 신호 자체는 탐지기가 찾고, 에이전트는 그 신호가 진짜 위험인지 맥락을 따져요. 예를 들어 입금이 줄었어도 정산 주기가 바뀐 거라면 경보를 낼 필요가 없죠. 뒤에서 보실 정밀도 차이가 바로 이 판단에서 나옵니다. 그럼 높음 경보가 나왔을 때 고객에게 무엇이 나가는지 보겠습니다.
