          - ["심사역이 읽는 근거 설명", "yes", "partial", "partial", "yes"]
          - ["사후 조기경보·상환 지원", "no", "partial", "partial", "yes"]
          - ["CRO 통제(규칙 버전·감사)", "yes", "yes", "partial", "yes"]
          - ["국내 처리·동의 삭제 통제", "yes", "yes", "partial", "yes"]
