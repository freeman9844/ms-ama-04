          - {title: 계약만 오감, body: "버전드 Pydantic 계약. 에이전트끼리 직접 호출하지 않습니다"}
          - {title: 도구는 VNet 안, body: "사내 도구는 오케스트레이터가 실행해 감사 로그에 남깁니다"}

  - layout: content
    notes: |
      방금 본 단계들 안에서 일하는 에이전트는 모두 아홉 개입니다. 표에서 가장 먼저 보셨으면 하는 칸은 맨 오른쪽 쓰기 권한이에요. 아홉 개 중 실제로 무언가를 만들 수 있는 건 둘뿐입니다. 조기경보 조사 에이전트가 raise_alert로 경보를 올리는 것, 그리고 추심 에이전트가 propose로 제안을 만드는 것이죠. 그 제안도 고객에게 나가는 건 심사역이 승인한 뒤예요. 나머지는 모두 읽고 설명만 합니다. 자율성을 보면 데이터 수집은 L3, 분류와 심사 분석, 검토는 L2로 낮게 두었어요. 동의 안내는 L4지만 정해진 사실을 알리는 일이고, 심사역 채팅 도우미는 가명 스냅샷만 보는 L1입니다. 모델은 분석가만 gpt-5.6-sol을 쓰고, 나머지는 대부분 작고 빠른 luna 계열을 써요. 자율성을 왜 이렇게 나눴을까요? 기준은 잘못됐을 때 되돌릴 수 있느냐입니다. 경보는 틀려도 사람이 확인하면 되지만, 고객에게 나간 문자나 대출 결정은 되돌리기 어렵거든요. 모델 크기도 같은 논리로 골랐어요. 근거를 많이 다루는 분석가에만 큰 모델을 쓰고, 나머지는 속도와 비용을 우선했습니다. 표의 아홉 줄 중 쓰기 권한 칸에 없음이 일곱 번 나온다는 것, 그게 이 설계의 요약이에요. 이 아홉 개가 원문의 다섯 개 설계와 어떻게 이어지는지 다음 장에서 비교해 보겠습니다.
