  # ── 02 아키텍처와 에이전트 ─────────────────────────────
  - layout: section
    notes: |
      데모 잘 보셨나요? 화면 뒤에서 무엇이 돌아갔는지 이제 열어 보겠습니다. 두 번째 파트에서는 Azure 구성과 네트워크, 아홉 개 에이전트에게 준 자율성의 경계, 그리고 설계하면서 내린 핵심 결정과 그 대가를 다룹니다. 먼저 전체 구조부터 그려 볼게요.
    section_no: "02"
