          - title: 심사역 시간이 줄지 않으면
            icon: "fluent:clock"
            body: "기술 비용은 작습니다. 검토 시간이 그대로면 60% 절감 근거가 없으므로 범위를 줄입니다"
          - title: 처리 위치를 허용받지 못하면
            icon: "fluent:lock_closed"
            body: "법무 승인이 없으면 국내 배포 모델이 나올 때까지 섀도 모드로 운영합니다"

  - layout: content
    notes: |
      이제 실제 화면으로 가 볼게요. 데모는 2분이고 다섯 구간으로 나눴습니다. 처음 15초는 콘솔의 신청 대시보드로 문제를 짚고, 이어서 고객이 동의 세 가지를 하고 신청하면 진행 화면이 실시간으로 바뀌는 걸 보시게 됩니다. 50초쯤엔 현금흐름과 정책 판정, 에이전트 의견을 보고 승인을 누르고요. 1분 20초쯤엔 경보 이유와 자동 안내, 그리고 추심 제안을 승인하는 화면이 나옵니다. 마지막 15초는 동의를 지금 만료시키고 삭제 증명을 띄우는 장면이에요. 라이브 데모는 늘 늦어질 수 있죠? 그래서 아래 세 건을 미리 준비했습니다. 이미 승인된 신청 A, 추심 제안이 승인을 기다리는 대출 B, 삭제 증명이 끝난 동의 C예요. 리허설에서는 제출하고 심사역 대기까지 62초가 걸렸는데, 50초 시점에 아직 대기 상태가 아니면 바로 A로 넘어가겠습니다. 데모를 보실 때 한 가지만 눈여겨봐 주세요. 화면마다 결정 버튼을 누르는 건 사람이라는 점입니다. 데모가 끝나면 이 화면들 뒤에서 무엇이 돌았는지 아키텍처로 설명드릴게요. 데모는 실제 Azure 환경에서 돌고, 화면의 숫자도 지금 이 순간 계산되는 값이에요. 그래서 네트워크 상황에 따라 몇 초씩 늦어질 수 있는데, 그때는 당황하지 않고 준비한 건으로 넘어가겠습니다. [콘솔 탭으로 전환] 그럼 시작하겠습니다.
    grid: {valign: middle}
