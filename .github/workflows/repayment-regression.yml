name: Offline repayment regression

on: pull_request

permissions:
  contents: read

jobs:
  repayment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Check registration, missed-payment redelivery and decision conflicts
        run: >-
          python -m pytest -q
          tests/orchestrator/test_monitoring_handlers.py
          tests/orchestrator/test_cosmos_store.py
          tests/shared/test_repayment.py
          tests/agents/test_repayment.py
          tests/agents/test_repayment_plan.py
          tests/agents/test_collections.py
