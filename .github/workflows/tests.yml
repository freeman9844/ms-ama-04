name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      # 계측 테스트(tests/policy/test_app.py)가 운영 이미지와 같은 OpenTelemetry 배포판을 쓴다(requirements-api.txt).
      - run: python -m pip install -e '.[dev]' azure-monitor-opentelemetry==1.8.11
      # Bicep 전개 테스트(tests/infra)는 RUN_INFRA_TESTS=1일 때만 돌고 여기서는 건너뛴다.
      - name: Run all offline tests
        run: python -m pytest -q -p no:warnings